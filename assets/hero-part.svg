<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
    <linearGradient id="burg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a2530"/>
      <stop offset="100%" stop-color="#5e191f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7a3c"/>
      <stop offset="50%" stop-color="#d4b06a"/>
      <stop offset="100%" stop-color="#9a7a3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- stem body -->
    <rect x="130" y="40" width="60" height="120" rx="6" fill="url(#burg)"/>
    <rect x="138" y="48" width="44" height="104" rx="4" fill="url(#metal)" opacity="0.35"/>
    <!-- clamp -->
    <rect x="110" y="155" width="100" height="28" rx="4" fill="url(#metal)"/>
    <rect x="118" y="163" width="84" height="12" rx="2" fill="#111"/>
    <!-- steerer -->
    <rect x="148" y="20" width="24" height="30" rx="3" fill="url(#metal)"/>
    <!-- bolts -->
    <circle cx="125" cy="169" r="5" fill="url(#gold)"/>
    <circle cx="155" cy="169" r="5" fill="url(#gold)"/>
    <circle cx="185" cy="169" r="5" fill="url(#gold)"/>
    <circle cx="155" cy="100" r="4" fill="url(#gold)"/>
    <!-- highlight -->
    <rect x="142" y="55" width="6" height="90" rx="3" fill="rgba(255,255,255,0.08)"/>
  </g>
</svg>
